<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bike Trip Manager</title>
    <meta name="description" content="Log in to manage and view your bike trips.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f1a;
            --bg2: #1a1a2e;
            --border: rgba(99,102,241,0.22);
            --purple: #6366f1;
            --purple-l: #818cf8;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --dim: #64748b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            background: linear-gradient(145deg, #161a2e, #1a2038);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(99,102,241,0.12);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--purple), #8b5cf6);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(99,102,241,0.4);
        }
        .brand-title { font-size: 1.25rem; font-weight: 700; color: #fff; }
        .brand-sub { font-size: 0.78rem; color: var(--muted); }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: var(--muted); margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px; color: #fff;
            font-size: 0.9rem; font-family: inherit;
            outline: none; transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--purple);
            background: rgba(99,102,241,0.06);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .btn-submit {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, var(--purple), #8b5cf6);
            color: #fff; border: none; border-radius: 12px;
            font-size: 0.95rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 6px 18px rgba(99,102,241,0.35);
            transition: all 0.2s; margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99,102,241,0.5);
        }
        .auth-footer {
            text-align: center; margin-top: 24px;
            font-size: 0.85rem; color: var(--muted);
        }
        .auth-footer a {
            color: var(--purple-l); text-decoration: none; font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .alert-error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171; border-radius: 10px;
            padding: 12px 16px; font-size: 0.85rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand">
        <div class="logo">🏍️</div>
        <div>
            <div class="brand-title">Welcome Back</div>
            <div class="brand-sub">Log in to view and track your bike trips</div>
        </div>
    </div>

    {% if error_message %}
    <div class="alert-error">
        ⚠️ {{ error_message }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" id="id_username" name="username" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" id="id_password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-submit">Log In →</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{% url 'account_signup' %}">Create one here</a>
    </div>
</div>

</body>
</html>
