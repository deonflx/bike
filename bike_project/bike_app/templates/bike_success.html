<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Logged — MOTOTRACK</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #111214;
            color: #e8e6e1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { text-align: center; padding: 40px 24px; max-width: 400px; width: 100%; }
        .check {
            width: 56px; height: 56px;
            border: 2px solid #22c55e;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 24px;
        }
        .title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
        .sub { font-size: 0.82rem; color: #5c5a56; margin-bottom: 32px; line-height: 1.5; }
        .actions { display: flex; gap: 10px; justify-content: center; }
        .btn {
            font-size: 0.82rem;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            transition: all 0.15s;
        }
        .btn-accent { background: #e8631a; color: #fff; }
        .btn-accent:hover { background: #d45515; }
        .btn-ghost {
            background: transparent;
            color: #9a9590;
            border: 1px solid rgba(255,255,255,0.07);
        }
        .btn-ghost:hover { color: #e8e6e1; border-color: rgba(255,255,255,0.13); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="check">✓</div>
    <h1 class="title">Trip Logged</h1>
    <p class="sub">Your expedition has been recorded and added to the route database.</p>
    <div class="actions">
        <a href="{% url 'customer_list' %}" class="btn btn-accent">View Log →</a>
        <a href="{% url 'customer_list' %}" class="btn btn-ghost">Home</a>
    </div>
</div>
</body>
</html>
